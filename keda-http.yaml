apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: hermes-agent
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  target:
    service: hermes-dashboard
    port: 9119
  rules:
    - hosts:
        - hermes.kdvops.com
  scalingMetric:
    concurrency:
      targetValue: 10
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hermes-agent
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    name: hermes-agent
    kind: Deployment
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: hermes-agent
