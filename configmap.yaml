---
# Hermes Agent Configuration
# Montado en /opt/data/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: hermes
data:
  config.yaml: |
    # =============================================================================
    # Model Configuration — DeepSeek via OpenAI-compatible endpoint
    # =============================================================================
    model:
      default: "deepseek-v4-flash"
      provider: "custom"
      base_url: "https://api.deepseek.com/v1"
      # context_length: 65536   # Auto-detected; set manually if needed

    # max_tokens: 8192

    # =============================================================================
    # Custom Provider — Ollama local en laptop (10.0.0.7)
    # =============================================================================
    # Uso: /model custom:laptop:ollamita:latest (cuando la laptop esté encendida)
    # Default siempre DeepSeek — si Ollama está caído, no se ve afectado
    custom_providers:
      - name: laptop
        base_url: "http://10.0.0.7:11434/v1"
        api_mode: chat_completions
        description: "Ollama en laptop de Kelvin (Qwen 2.5 1.5B)"

    # =============================================================================
    # MCP Servers — Tools externos vía Model Context Protocol
    # =============================================================================
    mcp_servers:
      # ── Context7 — Documentación de packages npm ───────────────────
      context7:
        command: "npx"
        args: ["-y", "@upstash/context7-mcp"]
        enabled: true
        description: "Contexto y documentación de packages npm en el agente"

      # ── Kubernetes — Interacción con clúster K8s ───────────────────
      kubernetes:
        command: "npx"
        args: ["-y", "mcp-server-kubernetes"]
        enabled: true
        description: "Interactúa con clústeres K8s via kubectl"

      # ── Jira — Issues, proyectos y sprints ─────────────────────────
      jira:
        command: "uvx"
        args: ["mcp-atlassian"]
        enabled: true
        description: "Gestiona issues, sprints y proyectos de Jira"
        # Env vars: JIRA_URL, JIRA_USERNAME, JIRA_API_TOKEN vía hermes-secrets

      # ── Azure DevOps — Work items, repos, builds, wikis ───────────
      azure-devops:
        command: "npx"
        args: ["-y", "@azure-devops/mcp", "the-punisher01", "--authentication", "pat"]
        enabled: true
        description: "Gestiona work items, repos, builds y wikis de Azure DevOps"
        # Env var: PERSONAL_ACCESS_TOKEN vía hermes-secrets

    # =============================================================================
    # Terminal Tool — Local dentro del container
    # =============================================================================
    terminal:
      backend: "local"
      cwd: "/opt/data/workspace"
      timeout: 180
      lifetime_seconds: 300

    # =============================================================================
    # Web Search — DuckDuckGo (sin API key)
    # =============================================================================
    web:
      backend: ddgs
      search_backend: ddgs

    tools:
      # Tools básicas habilitadas por defecto
      web_search: true
      web_extract: true
      file_tools: true
      code_execution: true
      terminal: true

    # =============================================================================
    # Gateway — Telegram (principal)
    # =============================================================================
    gateway:
      platforms:
        telegram:
          enabled: true
          # Bot token via TELEGRAM_BOT_TOKEN env var
      # Seguridad: solo usuarios autorizados
      allow_all_users: false

    # =============================================================================
    # Memory — SQLite persistente con FTS5 y tagging granular
    # =============================================================================
    memory:
      backend: "sqlite"
      fts5: true
      # Tags para organización granular por proyecto/contexto
      # Los tags se añaden en las entradas de memoria vía:
      #   memory(action="add", content="... #proyecto-x")
      # Y se filtran con session_search(query="#proyecto-x")
      #
      # Para memoria por proyecto, usar naming:
      #   #hermes-config  → Configuración de Hermes
      #   #redsocial      → Proyecto Secretos App
      #   #k8s            → Cluster Kubernetes
      #   #infra          → Infraestructura general

    # =============================================================================
    # Skills — Creación automática + habilidades específicas
    # =============================================================================
    skills:
      auto_create: true

    # =============================================================================
    # Plugins — Módulos opcionales
    # =============================================================================
    plugins:
      memory:
        # Providers disponibles: builtin (default), honcho, mem0
        # Para activar: hermes memory setup (modo interactivo)
        # luego instalar: uv pip install honcho-ai o uv pip install mem0ai
        provider: ""

  SOUL.md: |
    # SOUL.md — Hermes Agent 🌀

    _Soy Hermes, el mensajero de los dioses... pero en versión cloud nativa._

    ## Quién Soy
    Soy un agente autónomo corriendo en Kubernetes, diseñado para aprender,
    adaptarme y ejecutar tareas de forma inteligente.

    ## Mi Propósito
    Asistir a Kelvin en todo lo que necesite — desde responder preguntas
    hasta ejecutar código, buscar información, y orquestar tareas.

    ## Personalidad
    Inteligente, eficiente, con un toque de humor. Soy un agente,
    no un asistente genérico.

    ## Límites
    - No ejecuto comandos destructivos sin confirmación
    - No comparto información sensible
    - Opero bajo las reglas de mi operador

    ## Skills Instaladas
    - **nodejs-dev**: Desarrollo Node.js (Express/Nest, testing, debugging)
    - **php-dev**: Desarrollo PHP (Laravel/Composer, artisan, PHPUnit)
